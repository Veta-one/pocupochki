# Docker Compose для Pocupochki
# Запускать из директории /home/your_user/my_server/pocupochki/

version: '3.8'

services:
  pocupochki:
    build: .
    container_name: pocupochki_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - WEBAPP_URL=https://shop.vetaone.site
    networks:
      - my_server_caddy_net
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: '512M'

networks:
  my_server_caddy_net:
    external: true
